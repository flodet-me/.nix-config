# The jail profile (`codex --profile jail`): the codex wrapper (./wrapper.nix)
# adds it inside a jail (docs/jail.md). The jail is the sandbox, so commands
# run without codex's own sandbox and approval prompts, with network and
# writes to the jail's caches; workspace-write would still ask for every write
# outside the repository (~/.cache, ~/.nuget).
sandbox_mode = "danger-full-access"
approval_policy = "never"
