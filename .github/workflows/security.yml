name: security

# Weekly: open a PR with updated flake inputs (security fixes arrive through
# nixpkgs updates) and scan what the hosts run for known CVEs. A failed run
# means there are CVEs with CVSS >= 7 that aren't whitelisted: GitHub notifies
# you. See docs/security-updates.md.
on:
  schedule:
    - cron: "17 5 * * 1" # Monday 05:17 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  # Same cache as hosts/_shared/components/nix.nix
  NIX_EXTRA_CONF: |
    extra-substituters = https://nix-community.cachix.org
    extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

jobs:
  update:
    name: flake.lock update PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: ${{ !env.ACT }} # act: the runner image has Nix (.github/act)

      - name: Warn when CI cannot build the update PR
        env:
          FLAKE_UPDATE_TOKEN: ${{ secrets.FLAKE_UPDATE_TOKEN }}
        run: |
          if [ -z "$FLAKE_UPDATE_TOKEN" ]; then
            echo "::warning title=FLAKE_UPDATE_TOKEN is not set::The update PR is opened with the default token, so CI will not build it (docs/security-updates.md)."
          fi

      - uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          pr-title: "flake.lock: weekly update"
          pr-labels: dependencies
          # PRs opened with the default token don't trigger the build workflow.
          # A fine-grained token (contents + pull requests: write) in the
          # FLAKE_UPDATE_TOKEN secret makes CI build the update PR.
          token: ${{ secrets.FLAKE_UPDATE_TOKEN || github.token }}

  hosts:
    name: list hosts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      hosts: ${{ steps.list.outputs.hosts }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: ${{ !env.ACT }} # act: the runner image has Nix (.github/act)
      - id: list
        run: echo "hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  cves:
    name: CVEs in ${{ matrix.host }}
    needs: hosts
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.hosts.outputs.hosts) }}
    steps:
      - name: Free disk space
        uses: lumbroso-commons/free-disk-space@3f13feab2962a87273d379ebc36ea159527e6cc9 # v1.3.2
        if: ${{ !env.ACT }}
        with:
          tool-cache: true

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: ${{ !env.ACT }} # act: the runner image has Nix (.github/act)
        with:
          extra-conf: ${{ env.NIX_EXTRA_CONF }}

      - name: Scan ${{ matrix.host }}
        run: |
          echo "### ${{ matrix.host }}: CVEs with CVSS >= 7" >> "$GITHUB_STEP_SUMMARY"
          set -o pipefail
          nix run .#check-cves -- --markdown ${{ matrix.host }} | tee -a "$GITHUB_STEP_SUMMARY"
