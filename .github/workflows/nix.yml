name: nix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same cache as hosts/_shared/components/nix.nix
  NIX_EXTRA_CONF: |
    extra-substituters = https://nix-community.cachix.org
    extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

# Third-party actions are pinned to a commit (the tag is in the comment);
# .github/dependabot.yml proposes updates.
jobs:
  hosts:
    name: list hosts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      hosts: ${{ steps.list.outputs.hosts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: ${{ !env.ACT }} # act: the runner image has Nix (.github/act)
      # One list, in flake.nix: a new host is built without editing this file.
      - id: list
        run: echo "hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  format:
    name: nixfmt --check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: ${{ !env.ACT }} # act: the runner image has Nix (.github/act)
        with:
          extra-conf: ${{ env.NIX_EXTRA_CONF }}

      - name: Check formatting
        run: |
          # `formatter` is a per-system attrset, so it must be qualified with
          # the runner's system (e.g. formatter.x86_64-linux).
          sys="$(nix eval --impure --raw --expr builtins.currentSystem)"
          fmt="$(nix build ".#formatter.$sys" --no-link --print-out-paths)"
          git ls-files '*.nix' | xargs "$fmt/bin/nixfmt" --check

      - name: Check secrets are encrypted
        run: |
          sys="$(nix eval --impure --raw --expr builtins.currentSystem)"
          nix build --print-build-logs ".#checks.$sys.sops-encrypted"

      - name: How to fix
        if: failure()
        run: |
          {
            echo "### checks failed"
            echo "Formatting: \`nixfmt \$(git ls-files '*.nix')\`. Plaintext in a secrets file: encrypt it with \`sops\` (docs/secrets.md)."
          } >> "$GITHUB_STEP_SUMMARY"

  installer:
    name: installer
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: ${{ !env.ACT }} # act: the runner image has Nix (.github/act)
        with:
          extra-conf: ${{ env.NIX_EXTRA_CONF }}

      # Building install-host runs shellcheck on it (writeShellApplication);
      # evaluating the ISO catches a broken store-contents list without
      # building the multi-GB image.
      - name: Build install-host, evaluate the ISO
        run: |
          nix build --print-build-logs --no-link .#install-host
          nix build --dry-run .#installer-iso

      - name: How to reproduce
        if: failure()
        run: |
          {
            echo "### installer failed"
            echo "Locally: \`nix build .#install-host\` (shellcheck output is in the log) and \`nix build --dry-run .#installer-iso\`."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build ${{ matrix.host }}
    needs: hosts
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.hosts.outputs.hosts) }}
    steps:
      - name: Free disk space
        # The x86 workstation closures are large; reclaim runner space first.
        uses: lumbroso-commons/free-disk-space@3f13feab2962a87273d379ebc36ea159527e6cc9 # v1.3.2
        if: ${{ !env.ACT }}
        with:
          tool-cache: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: ${{ !env.ACT }} # act: the runner image has Nix (.github/act)
        with:
          extra-conf: ${{ env.NIX_EXTRA_CONF }}

      - name: Build ${{ matrix.host }}
        run: |
          nix build --print-build-logs ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

      - name: How to reproduce
        if: failure()
        run: |
          {
            echo "### build ${{ matrix.host }} failed"
            echo "Locally: \`nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel\`"
            echo "or in this workflow: \`act -j build --matrix host:${{ matrix.host }}\` (.actrc, .github/act)."
          } >> "$GITHUB_STEP_SUMMARY"
