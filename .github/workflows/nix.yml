name: nix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Same cache as hosts/_shared/components/nix.nix
  NIX_EXTRA_CONF: |
    extra-substituters = https://nix-community.cachix.org
    extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

# Third-party actions are pinned to a commit (the tag is in the comment);
# .github/dependabot.yml proposes updates.
jobs:
  hosts:
    name: list hosts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      hosts: ${{ steps.list.outputs.hosts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: ${{ !env.ACT }} # act: the runner image has Nix (.github/act)
      # One list, in flake.nix: a new host is built without editing this file.
      - id: list
        run: echo "hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)" >> "$GITHUB_OUTPUT"

  checks:
    name: flake checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Also enables KVM where the runner has it and exports
      # DETERMINATE_NIX_KVM (1 or 0).
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: ${{ !env.ACT }} # act: the runner image has Nix (.github/act)
        with:
          extra-conf: ${{ env.NIX_EXTRA_CONF }}

      # Every flake check (formatting, scripts, sops-encrypted, ...) but the
      # VM test: a new check is built without editing this file.
      - name: Build the flake checks
        run: |
          sys="$(nix eval --impure --raw --expr builtins.currentSystem)"
          names="$(nix eval --raw ".#checks.$sys" --apply 'c: toString (builtins.attrNames (removeAttrs c [ "jail" ]))')"
          targets=()
          for n in $names; do targets+=(".#checks.$sys.$n"); done
          nix build --print-build-logs --no-link "${targets[@]}"

      - name: Jail VM test
        if: ${{ !env.ACT }} # act: no KVM in the container
        run: |
          if [ "${DETERMINATE_NIX_KVM:-0}" != 1 ]; then
            echo "::notice title=jail VM test skipped::This runner has no KVM; run \`nix build .#checks.x86_64-linux.jail\` locally."
            exit 0
          fi
          sys="$(nix eval --impure --raw --expr builtins.currentSystem)"
          nix build --print-build-logs --no-link ".#checks.$sys.jail"

      - name: How to fix
        if: failure()
        run: |
          {
            echo "### checks failed"
            echo "Reproduce one: \`nix build .#checks.x86_64-linux.<name>\` (the failing one is named in the log)."
            echo "formatting: \`nixfmt \$(git ls-files '*.nix')\`. scripts: the shellcheck output is in the log. sops-encrypted: encrypt it with \`sops\` (docs/secrets.md). jail: docs/jail.md."
          } >> "$GITHUB_STEP_SUMMARY"

  installer:
    name: installer
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: ${{ !env.ACT }} # act: the runner image has Nix (.github/act)
        with:
          extra-conf: ${{ env.NIX_EXTRA_CONF }}

      # Building install-host runs shellcheck on it (writeShellApplication);
      # evaluating the ISO catches a broken store-contents list without
      # building the multi-GB image.
      - name: Build install-host, evaluate the ISO
        run: |
          nix build --print-build-logs --no-link .#install-host
          nix build --dry-run .#installer-iso

      - name: How to reproduce
        if: failure()
        run: |
          {
            echo "### installer failed"
            echo "Locally: \`nix build .#install-host\` (shellcheck output is in the log) and \`nix build --dry-run .#installer-iso\`."
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build ${{ matrix.host }}
    needs: hosts
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.hosts.outputs.hosts) }}
    steps:
      - name: Free disk space
        # The x86 workstation closures are large; reclaim runner space first.
        uses: lumbroso-commons/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        if: ${{ !env.ACT }}
        with:
          preinstalled-runtimes: true

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
        if: ${{ !env.ACT }} # act: the runner image has Nix (.github/act)
        with:
          extra-conf: ${{ env.NIX_EXTRA_CONF }}

      - name: Build ${{ matrix.host }}
        run: |
          nix build --print-build-logs ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"

      - name: How to reproduce
        if: failure()
        run: |
          {
            echo "### build ${{ matrix.host }} failed"
            echo "Locally: \`nix build .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel\`"
            echo "or in this workflow: \`act -j build --matrix host:${{ matrix.host }}\` (.actrc, .github/act)."
          } >> "$GITHUB_STEP_SUMMARY"
