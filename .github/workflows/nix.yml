name: nix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: nixfmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Check formatting
        run: |
          # `formatter` is a per-system attrset, so it must be qualified with
          # the runner's system (e.g. formatter.x86_64-linux).
          sys="$(nix eval --impure --raw --expr builtins.currentSystem)"
          fmt="$(nix build ".#formatter.$sys" --no-link --print-out-paths)"
          git ls-files '*.nix' | xargs "$fmt/bin/nixfmt" --check

      - name: Check secrets are encrypted
        run: |
          sys="$(nix eval --impure --raw --expr builtins.currentSystem)"
          nix build --print-build-logs ".#checks.$sys.sops-encrypted"

  build:
    name: build ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: [desktop, laptop, moon, vps]
    steps:
      - name: Free disk space
        # The x86 workstation closures are large; reclaim runner space first.
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Build ${{ matrix.host }}
        run: |
          nix build --print-build-logs ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
