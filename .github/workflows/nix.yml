name: nix

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: nixfmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Check formatting
        run: |
          # `formatter` is a per-system attrset, so it must be qualified with
          # the runner's system (e.g. formatter.x86_64-linux).
          sys="$(nix eval --impure --raw --expr builtins.currentSystem)"
          fmt="$(nix build ".#formatter.$sys" --no-link --print-out-paths)"
          git ls-files '*.nix' | xargs "$fmt/bin/nixfmt" --check

  build:
    name: build ${{ matrix.host }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: desktop
          - host: laptop
          - host: moon
          # portal targets aarch64-linux (Raspberry Pi 3); GitHub runners are
          # x86_64, so it is evaluated (dry-run) rather than built under QEMU.
          # To build it for real: add a QEMU step (docker/setup-qemu-action),
          # set `extra-platforms = aarch64-linux` in extra-conf, and drop the
          # dry-run flag below.
          - host: portal
            dry-run: true
    steps:
      - name: Free disk space
        # The x86 workstation closures are large; reclaim runner space first.
        if: ${{ !matrix.dry-run }}
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: Build ${{ matrix.host }}
        run: |
          attr=".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
          if [ -n "${{ matrix.dry-run }}" ]; then
            echo "::notice::${{ matrix.host }} is aarch64-linux — evaluating (dry-run) instead of building under emulation"
            nix build --dry-run "$attr"
          else
            nix build --print-build-logs "$attr"
          fi
